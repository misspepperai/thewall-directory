<html lang="en">
<head>

<!-- Private listings console. Never indexed, never followed: it is not site content,
     it has no canonical public URL, and it is deliberately absent from both sitemaps. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Private administrative console for The Wall. Not public content.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --porcelain:#FAF9F6; --stone:#E8E4DC; --stone-lt:#F3F1EC; --cobalt:#1B4FD8;
    --oxblood:#6E1423; --ink:#0E1B33; --chrome:#686D75;--chrome-dk:#85898F;
    --serif:'Newsreader',Georgia,serif; --sans:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--sans); background:var(--porcelain); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1080px; margin:0 auto; padding:0 24px; }
  .topbar { border-bottom:1px solid var(--stone); }
  .topbar-in { display:flex; align-items:center; justify-content:space-between; height:58px; }
  .wordmark { font-family:var(--serif); font-weight:700; font-size:19px; text-decoration:none; color:inherit; }
  .wordmark small { font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--chrome); margin-left:10px; }
  .mono { font-family:var(--mono); }
  .btn { font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.08em; border-radius:5px; padding:9px 14px; cursor:pointer; border:1px solid var(--stone); background:#fff; color:var(--ink); }
  .btn:hover { border-color:var(--ink); }
  .btn.blue { background:var(--cobalt); border-color:var(--cobalt); color:#fff; }
  .btn.blue:hover { background:var(--oxblood); border-color:var(--oxblood); }
  .btn.red { color:var(--oxblood); }
  .btn.red:hover { border-color:var(--oxblood); }

  .auth-card { max-width:400px; margin:80px auto; background:#fff; border:1px solid var(--stone); border-radius:12px; padding:30px; }
  .auth-card h1 { font-family:var(--serif); font-size:26px; font-weight:600; }
  .auth-card .note { font-family:var(--mono); font-size:9.5px; color:var(--chrome); letter-spacing:.1em; margin-top:6px; line-height:1.6; }
  .field { margin-top:14px; }
  .field label { display:block; font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.12em; color:var(--chrome); margin-bottom:6px; }
  .field input, .field select, .field textarea { width:100%; font-family:var(--sans); font-size:14px; background:#fff; border:1px solid var(--stone); border-radius:5px; padding:10px 12px; outline:0; color:var(--ink); }
  .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--cobalt); }
  .auth-actions { display:flex; gap:10px; margin-top:20px; }
  .msg { font-family:var(--mono); font-size:10.5px; margin-top:12px; letter-spacing:.04em; }

  .dash { display:none; padding:34px 0 80px; }
  .dash-head { display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .dash-head h1 { font-family:var(--serif); font-size:30px; font-weight:600; }
  .stats { font-family:var(--mono); font-size:10.5px; color:var(--chrome); letter-spacing:.08em; }
  .sect { margin-top:36px; }
  .sect-head { display:flex; align-items:baseline; gap:12px; border-bottom:1px solid var(--stone); padding-bottom:10px; margin-bottom:14px; }
  .sect-head h2 { font-family:var(--serif); font-size:21px; font-weight:600; }
  .sect-head span { font-family:var(--mono); font-size:10px; color:var(--chrome); }
  .row { background:#fff; border:1px solid var(--stone); border-radius:9px; padding:14px 16px; margin-bottom:9px; }
  .row-top { display:flex; align-items:center; gap:12px; }
  .row img { width:32px; height:32px; border-radius:6px; border:1px solid var(--stone-lt); padding:3px; object-fit:contain; background:#fff; }
  .row .nm { font-weight:600; font-size:14.5px; }
  .row .dm { font-family:var(--mono); font-size:10px; color:var(--chrome); }
  .row .cat { font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:.08em; color:var(--cobalt); }
  .row .desc { font-size:12.5px; color:#4A5468; margin-top:8px; line-height:1.5; }
  .row-actions { display:flex; gap:8px; margin-left:auto; flex-shrink:0; }
  .editor { display:none; margin-top:12px; border-top:1px solid var(--stone-lt); padding-top:4px; }
  .editor .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .searchbar { width:100%; font-family:var(--mono); font-size:12px; background:#fff; border:1px solid var(--stone); border-radius:6px; padding:11px 14px; outline:0; margin-bottom:14px; color:var(--ink); }
  .searchbar:focus { border-color:var(--cobalt); }
  .empty { font-family:var(--mono); font-size:11px; color:var(--chrome); letter-spacing:.06em; padding:18px 0; }
  .pager { display:flex; gap:10px; align-items:center; margin-top:10px; }
  @media (max-width:640px){ .editor .grid2 { grid-template-columns:1fr; } .row-top { flex-wrap:wrap; } .row-actions { margin-left:0; } }
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}</style>
</head>
<body>
<!-- a11y:begin (managed by inject-a11y.mjs) --><style>
.skip-link{position:absolute;left:-9999px;top:0;z-index:100;padding:12px 18px;background:var(--ink,#0E1B33);color:#fff;font-family:var(--sans,system-ui,sans-serif);font-size:14px;font-weight:600;text-decoration:none}
.skip-link:focus,.skip-link:focus-visible{left:0}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--cobalt,#1B4FD8);outline-offset:2px}
@media (prefers-contrast:more){a:focus-visible,button:focus-visible{outline-width:4px}}
</style>
<a class="skip-link" href="#dash">Skip to main content</a>
<!-- a11y:end -->

<nav class="topbar"><div class="wrap topbar-in">
  <a class="wordmark" href="./">The Wall <small>ADMIN CONSOLE</small></a>
  <button class="btn" id="signout" style="display:none" onclick="signOut()">SIGN OUT</button>
</div></nav>

<!-- auth -->
<div class="auth-card" id="auth">
  <h1>Admin sign in</h1>
  <p class="note">ACCESS IS LIMITED TO THE AUTHORIZED ADMIN EMAIL. OTHER ACCOUNTS CAN SIGN IN BUT CANNOT READ OR WRITE LISTINGS.</p>
  <div class="field"><label for="email">EMAIL</label><input id="email" type="email" autocomplete="username"></div>
  <div class="field"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password"></div>
  <div class="auth-actions">
    <button class="btn blue" onclick="signIn()">SIGN IN</button>
    <button class="btn" onclick="signUp()">CREATE ACCOUNT</button>
  </div>
  <div class="msg" id="auth-msg"></div>
</div>

<!-- dashboard -->
<main class="dash wrap" id="dash" tabindex="-1">
  <div class="dash-head">
    <h2>Listings console</h2>
    <span class="stats" id="stats">—</span>
  </div>

  <section class="sect">
    <div class="sect-head"><h2>Pending review</h2><span id="pending-count"></span></div>
    <div id="pending"></div>
  </section>

  <section class="sect">
    <div class="sect-head"><h2>Add a listing</h2><span>PUBLISHES IMMEDIATELY</span></div>
    <div class="row">
      <div class="editor" style="display:block;border:0;padding-top:8px">
        <div class="grid2">
          <div class="field"><label for="add-name">NAME</label><input id="add-name"></div>
          <div class="field"><label for="add-domain">DOMAIN</label><input id="add-domain" placeholder="example.com"></div>
          <div class="field"><label for="add-cat">CATEGORY</label><select id="add-cat"></select></div>
          <div class="field"><label for="add-sub">SPECIALTY</label><input id="add-sub"></div>
        </div>
        <div class="field"><label for="add-desc">DESCRIPTION</label><textarea id="add-desc" rows="2"></textarea></div>
        <div style="margin-top:12px"><button class="btn blue" onclick="addListing()">ADD LISTING</button><span class="msg" id="add-msg"></span></div>
      </div>
    </div>
  </section>

  <section class="sect">
    <div class="sect-head"><h2>All listings</h2><span id="all-count"></span></div>
    <input class="searchbar" id="admin-q" aria-label="Filter listings by name, domain or category" placeholder="FILTER BY NAME, DOMAIN, CATEGORY…">
    <div id="rows"></div>
    <div class="pager">
      <button class="btn" id="more-btn" onclick="showMore()" style="display:none">SHOW MORE</button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL = 'https://kdvuewhbinmhmrysusbd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdnVld2hiaW5taG1yeXN1c2JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MzM2NjUsImV4cCI6MjA5OTAwOTY2NX0.8YF8O_iaCp5C9z8gr8dfEPmW7B8fZCcZ4pIRTwxwsPU';
const CATS = ['Sales','Marketing','SEO','Thought Leadership','Creative Strategy','Automation','Demand Gen','Content Marketing','Social Media Marketing','AI Marketing'];
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let rows = [], shown = 50;

async function init() {
  ['add-cat'].forEach(id => $(id).innerHTML = CATS.map(c => `<option>${esc(c)}</option>`).join(''));
  const { data: { session } } = await sb.auth.getSession();
  session ? showDash() : showAuth();
  sb.auth.onAuthStateChange((_e, s) => s ? showDash() : showAuth());
}

function showAuth() { $('auth').style.display = 'block'; $('dash').style.display = 'none'; $('signout').style.display = 'none'; }

async function showDash() {
  $('auth').style.display = 'none'; $('dash').style.display = 'block'; $('signout').style.display = 'inline-block';
  await refresh();
}

async function refresh() {
  const { data, error } = await sb.from('directory_companies')
    .select('id,name,domain,category,subcategory,description,status')
    .order('id', { ascending: false }).limit(5000);
  if (error) { $('stats').textContent = 'READ FAILED — IS THIS THE ADMIN ACCOUNT?'; $('pending').innerHTML = ''; $('rows').innerHTML = ''; return; }
  rows = data;
  const pending = rows.filter(r => r.status === 'pending');
  $('stats').textContent = `${rows.length} TOTAL · ${rows.length - pending.length} LIVE · ${pending.length} PENDING`;
  renderPending(pending);
  renderRows();
}

function renderPending(pending) {
  $('pending-count').textContent = `${pending.length}`;
  $('pending').innerHTML = pending.length ? pending.map(r => `
    <div class="row">
      <div class="row-top">
        <img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(r.domain)}&sz=64" alt="">
        <div><div class="nm">${esc(r.name)}</div><div class="dm">${esc(r.domain)} · <span class="cat">${esc(r.category)}</span> / ${esc(r.subcategory)}</div></div>
        <div class="row-actions">
          <button class="btn blue" onclick="setStatus(${r.id},'approved')">APPROVE</button>
          <button class="btn red" onclick="del(${r.id})">DELETE</button>
        </div>
      </div>
      <div class="desc">${esc(r.description)}</div>
    </div>`).join('') : '<div class="empty">NO PENDING SUBMISSIONS.</div>';
}

function renderRows() {
  const q = $('admin-q').value.trim().toLowerCase();
  const live = rows.filter(r => r.status === 'approved' && (!q || [r.name, r.domain, r.category, r.subcategory].join(' ').toLowerCase().includes(q)));
  $('all-count').textContent = `${live.length}`;
  const page = live.slice(0, shown);
  $('rows').innerHTML = page.map(r => `
    <div class="row" id="row-${r.id}">
      <div class="row-top">
        <img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(r.domain)}&sz=64" alt="">
        <div><div class="nm">${esc(r.name)}</div><div class="dm">${esc(r.domain)} · <span class="cat">${esc(r.category)}</span> / ${esc(r.subcategory)}</div></div>
        <div class="row-actions">
          <button class="btn" onclick="toggleEdit(${r.id})">EDIT</button>
          <button class="btn red" onclick="del(${r.id})">DELETE</button>
        </div>
      </div>
      <div class="editor" id="edit-${r.id}">
        <div class="grid2">
          <div class="field"><label for="e-name-${r.id}">NAME</label><input id="e-name-${r.id}" value="${esc(r.name)}"></div>
          <div class="field"><label for="e-sub-${r.id}">SPECIALTY</label><input id="e-sub-${r.id}" value="${esc(r.subcategory)}"></div>
          <div class="field"><label for="e-cat-${r.id}">CATEGORY</label><select id="e-cat-${r.id}">${CATS.map(c => `<option ${c===r.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
          <div class="field"><label for="e-dom-${r.id}">DOMAIN</label><input id="e-dom-${r.id}" value="${esc(r.domain)}"></div>
        </div>
        <div class="field"><label for="e-desc-${r.id}">DESCRIPTION</label><textarea id="e-desc-${r.id}" rows="2">${esc(r.description)}</textarea></div>
        <div style="margin-top:10px"><button class="btn blue" onclick="saveEdit(${r.id})">SAVE</button></div>
      </div>
    </div>`).join('') || '<div class="empty">NO MATCHES.</div>';
  $('more-btn').style.display = live.length > shown ? 'inline-block' : 'none';
}

function showMore() { shown += 100; renderRows(); }
function toggleEdit(id) { const e = $('edit-' + id); e.style.display = e.style.display === 'block' ? 'none' : 'block'; }

async function saveEdit(id) {
  const upd = {
    name: $('e-name-' + id).value.trim(), subcategory: $('e-sub-' + id).value.trim(),
    category: $('e-cat-' + id).value, domain: $('e-dom-' + id).value.trim().toLowerCase(),
    description: $('e-desc-' + id).value.trim()
  };
  const { error } = await sb.from('directory_companies').update(upd).eq('id', id);
  if (error) alert('Save failed: ' + error.message); else refresh();
}

async function setStatus(id, status) {
  const { error } = await sb.from('directory_companies').update({ status }).eq('id', id);
  if (error) alert('Update failed: ' + error.message); else refresh();
}

async function del(id) {
  if (!confirm('Delete this listing permanently?')) return;
  const { error } = await sb.from('directory_companies').delete().eq('id', id);
  if (error) alert('Delete failed: ' + error.message); else refresh();
}

async function addListing() {
  const row = {
    name: $('add-name').value.trim(), domain: $('add-domain').value.trim().toLowerCase().replace(/^www\./,''),
    category: $('add-cat').value, subcategory: $('add-sub').value.trim(),
    description: $('add-desc').value.trim(), status: 'approved'
  };
  if (!row.name || !row.domain || !row.subcategory || !row.description) { $('add-msg').textContent = ' ALL FIELDS REQUIRED.'; return; }
  const { error } = await sb.from('directory_companies').insert(row);
  $('add-msg').textContent = error ? ' FAILED: ' + error.message : ' ADDED.';
  if (!error) { ['add-name','add-domain','add-sub','add-desc'].forEach(id => $(id).value = ''); refresh(); }
}

async function signIn() {
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  $('auth-msg').textContent = error ? error.message.toUpperCase() : '';
}
async function signUp() {
  const { data, error } = await sb.auth.signUp({ email: $('email').value.trim(), password: $('password').value });
  $('auth-msg').textContent = error ? error.message.toUpperCase()
    : (data.session ? '' : 'ACCOUNT CREATED — CHECK EMAIL TO CONFIRM, THEN SIGN IN.');
}
async function signOut() { await sb.auth.signOut(); }

$('admin-q').addEventListener('input', () => { shown = 50; renderRows(); });
init();
</script>
<script src="/nav.js"></script>
</body>
</html>
